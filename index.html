<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crave Kitchen — रोज़ का हिसाब</title>
<style>
  :root {
    --paper:#FAF6EC; --line:#DDD3B8; --ink:#262019; --ink-soft:#6B5F4C;
    --green:#2E5B41; --green-soft:#E4EEE3; --clay:#A8503A; --clay-soft:#F4E4DC;
    --card:#FFFFFF; --shadow:rgba(38,32,25,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#1B1712; --line:#3A3226; --ink:#EFE7D8; --ink-soft:#B3A78F;
      --green:#6FAE86; --green-soft:#223228; --clay:#D98468; --clay-soft:#35251F;
      --card:#241F18; --shadow:rgba(0,0,0,.35); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    padding:14px 10px 70px; line-height:1.5; }
  .wrap { max-width:820px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:10px;
    margin-bottom:14px; border-bottom:2px solid var(--ink); padding-bottom:10px; }
  header .kicker { font-size:12px; color:var(--green); font-weight:600; }
  h1 { font-family:Georgia,"Noto Serif Devanagari",serif; font-size:22px; margin:2px 0 0; }
  .pl-box { text-align:right; background:var(--green-soft); border-radius:8px; padding:6px 12px; min-width:118px; }
  .pl-box.loss { background:var(--clay-soft); }
  .pl-label { font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .pl-value { font-size:20px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; line-height:1.2; }
  .pl-box.loss .pl-value { color:var(--clay); }
  .pl-sub { font-size:11px; color:var(--clay); }
  .pl-sub:empty { display:none; }

  .date-row { display:flex; align-items:center; gap:10px; margin:12px 0; flex-wrap:wrap; }
  .date-row label { font-weight:700; font-size:14px; }
  .date-row input[type="date"] { font-size:16px; font-weight:700; padding:8px 10px;
    border:1.5px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }

  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;
    -webkit-overflow-scrolling:touch; }
  .tab-btn { flex:0 0 auto; font-size:13px; font-weight:700; padding:9px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .tab-btn.active { background:var(--green); color:#fff; border-color:var(--green); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px; margin-bottom:16px; box-shadow:0 1px 3px var(--shadow); }
  .card h2 { font-family:Georgia,"Noto Serif Devanagari",serif; font-size:17px; margin:0 0 4px; }
  .card .hint { color:var(--ink-soft); font-size:12.5px; margin:0 0 12px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th { text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:700;
    border-bottom:1.5px solid var(--ink); padding:6px 4px; }
  tbody td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .name-cell { font-weight:600; }
  .table-scroll { overflow-x:auto; }

  input[type="number"], input[type="text"] { font-size:15px; font-variant-numeric:tabular-nums;
    padding:6px 8px; border:1.5px solid var(--line); border-radius:6px; background:var(--paper);
    color:var(--ink); width:90px; }
  input[type="number"].mini { width:78px; }
  input[type="text"].wide { width:100%; }
  input:focus { outline:2px solid var(--clay); outline-offset:1px; }
  input:disabled { opacity:.55; }

  .total-row td { border-top:2px solid var(--ink); border-bottom:none; padding-top:12px;
    font-weight:700; font-size:15.5px; }
  .total-row .num { color:var(--clay); }

  button.primary { font-size:14px; font-weight:700; padding:11px 18px; border-radius:8px;
    border:none; background:var(--green); color:#fff; cursor:pointer; margin-top:12px; width:100%; }
  button.secondary { font-size:13px; font-weight:600; padding:7px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--green-soft); color:var(--green); cursor:pointer; }
  button.add-row { font-size:13px; font-weight:700; padding:8px 14px; border-radius:8px;
    border:1.5px dashed var(--green); background:transparent; color:var(--green); cursor:pointer;
    width:100%; margin-top:8px; }
  button.icon-btn { background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:2px 6px; }
  button.icon-btn.danger { color:var(--clay); }
  button.chip { font-size:12px; padding:5px 12px; border-radius:14px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink-soft); cursor:pointer; }
  button.chip.on { background:var(--green); color:#fff; border-color:var(--green); }
  button.chip.on.absent { background:var(--clay); border-color:var(--clay); }
  .att-pair { display:flex; gap:6px; }

  .save-status { font-size:12.5px; color:var(--green); margin-top:8px; min-height:16px; }
  .save-status.err { color:var(--clay); }

  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:8px; }
  .stat { background:var(--green-soft); border-radius:8px; padding:12px; text-align:center; }
  .stat.clay { background:var(--clay-soft); }
  .stat .label { font-size:12px; color:var(--ink-soft); }
  .stat .value { font-size:20px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; }
  .stat.clay .value { color:var(--clay); }

  .breakdown-list { font-size:13.5px; color:var(--ink-soft); margin-top:10px; }
  .breakdown-list div { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--line); }
  .breakdown-list .strong { font-weight:700; color:var(--ink); }

  .worker-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .worker-row:last-child { border-bottom:none; }
  .worker-row .name { font-weight:600; }

  .add-form { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .master-manage { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
  .master-manage summary { cursor:pointer; font-size:13px; color:var(--green); font-weight:700; }
  .master-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; }
  .muted { color:var(--ink-soft); }
  .warn { color:var(--clay); font-size:12.5px; margin:8px 0 0; }
  a { color:var(--green); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Crave Kitchen</div>
      <h1>रोज़ का हिसाब</h1>
    </div>
    <div class="pl-box" id="headerPL">
      <div class="pl-label">लाभ / हानि</div>
      <div class="pl-value">…</div>
      <div class="pl-sub"></div>
    </div>
  </header>

  <div class="date-row">
    <label for="mainDate">तारीख</label>
    <input type="date" id="mainDate">
    <label for="cashInput" style="min-width:auto;">कैश ₹</label>
    <input type="number" id="cashInput" min="0" step="1" placeholder="0" style="width:100px;">
    <label for="onlineInput" style="min-width:auto;">ऑनलाइन ₹</label>
    <input type="number" id="onlineInput" min="0" step="1" placeholder="0" style="width:100px;">
    <span class="save-status" id="paymentStatus" style="min-height:auto;"></span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn" data-tab="daily">Daily का सामान</button>
    <button class="tab-btn" data-tab="momos">मोमोज़ बनाने का सामान</button>
    <button class="tab-btn" data-tab="packing">Packing</button>
    <button class="tab-btn" data-tab="workexpense">Work Expense</button>
    <button class="tab-btn" data-tab="attendance">Attendance</button>
    <button class="tab-btn" data-tab="momoshisab">रोज़ का हिसाब</button>
    <button class="tab-btn" data-tab="stock">Stock / Material</button>
    <button class="tab-btn" data-tab="others">Others</button>
  </div>

  <div id="tabContent"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAn2anBO1U38hECJ3D9zAX9qYJzPwF8uN7-BxM7Of1zj8QaUorNBI3NC7cuSrQ8ln1/exec";

  // ---------- helpers ----------
  function todayStr() { const d=new Date(); const tz=d.getTimezoneOffset()*60000; return new Date(d-tz).toISOString().slice(0,10); }
  function money(v){ return "₹"+Math.round(Number(v)||0).toLocaleString("en-IN"); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // ---- jaldi-jaldi tab badalne par atakna band: purane tab ke jawab ignore, aur dekhe hue tab ka data 60s yaad ----
  const TAB_READS = new Set(["getMaster","getEntries","getWorkExpenseItems","getWorkExpense","getWorkers","getAttendance","getOthers","getStockReport","getMomosDailySales","getMomosVarieties"]);
  let renderSeq = 0, tabTimer = null;
  const memo = {};
  function memoClear() { for (const k in memo) delete memo[k]; }
  const NEVER = () => new Promise(() => {});   // purana (stale) render yahin ruk jaata hai, screen ko chhoota nahi

  let jsonpCounter = 0;
  function jsonp(params) {
    return new Promise((resolve, reject) => {
      const cbName = "jsonp_cb_" + (jsonpCounter++);
      const timeout = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 30000);
      function cleanup(){ clearTimeout(timeout); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
      window[cbName] = (data) => { cleanup(); resolve(data); };
      const qp = Object.assign({}, params, { callback: cbName });
      Object.keys(qp).forEach(k => { if (typeof qp[k] === "object") qp[k] = JSON.stringify(qp[k]); });
      const qs = new URLSearchParams(qp).toString();
      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?" + qs;
      script.onerror = () => { cleanup(); reject(new Error("network")); };
      document.body.appendChild(script);
    });
  }
  // backend कभी-कभी { ok:false, error: "..." } के साथ भी "सफलतापूर्वक" जवाब देता है
  // (जैसे "सर्वर व्यस्त है") — उसे भी असल में एक failure माना जाए, चुपचाप success मत दिखाओ
  async function call(action, extra) {
    const params = Object.assign({ action }, extra || {});
    if (params.payload) params.payload = JSON.stringify(params.payload);
    const isRead = TAB_READS.has(action), seq = renderSeq;
    const key = isRead ? action + "|" + JSON.stringify(params) : null;
    if (isRead && memo[key] && Date.now() - memo[key].t < 60000) return JSON.parse(memo[key].v);
    if (!isRead && /^(save|add|update|toggle|delete)/.test(action)) memoClear();
    let result;
    try {
      // padhne wali request pehli baar fail ho (server abhi jaag raha ho) to ek baar apne-aap dobara
      try { result = await jsonp(params); }
      catch (err) { if (/^get/.test(action) && seq === renderSeq) result = await jsonp(params); else throw err; }
    } catch (err) {
      if (isRead && seq !== renderSeq) return NEVER();
      throw err;
    }
    if (isRead) {
      if (result && !result.error) memo[key] = { t: Date.now(), v: JSON.stringify(result) };
      if (seq !== renderSeq) return NEVER();
    }
    if (/^(save|add|update|toggle|delete)/.test(action) && result && (result.ok === false || result.error)) {
      scheduleHeaderRefresh();
      throw new Error(result.error || "सेव नहीं हो पाया");
    }
    if (/^(save|add|delete|toggle)/.test(action) && action !== "savePayment" && action !== "saveMomosHisabRate") {
      scheduleHeaderRefresh();
    }
    return result;
  }
  // fail hone par null deta hai (error throw nahi karta)
  function safeCall(action, extra) { return call(action, extra).catch(() => null); }
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(resolve => setTimeout(() => resolve(null), ms))]);
  }
  // कोई भी tab लोड होते वक़्त fail हो जाए तो हमेशा के लिए "लोड हो रहा है" पर मत अटको —
  // साफ़ error + दोबारा कोशिश करने का बटन दिखाओ
  function showLoadError(container, err) {
    container.innerHTML = `<div class="card"><p class="warn">⚠ लोड नहीं हो पाया (नेटवर्क या सर्वर की दिक्कत)।${err && err.message ? " <small>[" + esc(err.message) + "]</small>" : ""}</p>
      <button class="secondary" id="loadRetryBtn">फिर कोशिश करें</button></div>`;
    document.getElementById("loadRetryBtn").addEventListener("click", () => renderActiveTab());
  }
  // सामान का ₹/यूनिट एक बार डालने के बाद हर दिन वही रहे (बदलने तक)
  function itemRateKey(section, id) { return "rate_" + section + "_" + id; }
  function persistItemRate(section, id, value) {
    try { localStorage.setItem("crave_" + itemRateKey(section, id), String(value)); } catch (e) {}
    call("saveMomosHisabRate", { payload: { key: itemRateKey(section, id), value } }).catch(() => {});
  }

  document.getElementById("mainDate").value = todayStr();
  document.getElementById("mainDate").addEventListener("change", () => {
    // पहले date/cache बदलो, फिर उसी नई तारीख पर tab/payment load करो।
    // पुरानी तारीख का render पहले चलाने से duplicate requests और गलत data दिखता था।
    onDateChange();
    renderActiveTab();
    // Payment is included in the day-summary response; avoid a second API request.
  });

  function currentDate() { return document.getElementById("mainDate").value || todayStr(); }

  // ===================================================================
  // ऊपर हेडर में लाभ / हानि — हर टैब में दिखता है
  // ===================================================================
  let dayCache = null;   // { date, rates, expenseLines, missing, totalExpense, counts }
  let paymentLoadedFor = null;   // kis तारीख का कैश/ऑनलाइन ऊपर के बॉक्स में है

  // मोमोज़ की कीमत = (पनीर पीस ÷ 10) × पनीर रेट + (वेज पीस ÷ 10) × वेज रेट — ये कुल खर्च में जुड़ती है
  // गिनती पता न हो तो null
  function momosCostFor(d) {
    if (!d) return null;
    if (Array.isArray(d.salesEntries)) return d.salesEntries.reduce((sum,e)=>sum+(Number(e.total)||0),0);
    if (!d.counts) return null;
    return (d.counts.paneer / PIECES_PER_PLATE) * plateRateFrom(d.rates, "paneer")
         + (d.counts.veg / PIECES_PER_PLATE) * plateRateFrom(d.rates, "veg");
  }

  // लाभ / हानि = (कैश + ऑनलाइन) − कुल खर्च;  कुल खर्च = बाकी टैब्स का जोड़ + मोमोज़ की कीमत
  function computePL() {
    const date = currentDate();
    if (!dayCache || dayCache.date !== date || paymentLoadedFor !== date) return null;
    const received = receivedNow();
    const exactExpense = Number(dayCache.totalExpense);
    const materialCost = dayCache.stock && Number(dayCache.stock.materialCost) >= 0 ? Number(dayCache.stock.materialCost) : null;
    if (!Number.isFinite(exactExpense) || materialCost === null) return { received, otherExpense: exactExpense, momos: materialCost, expense: null, pl: null };
    return { received, otherExpense: exactExpense, momos: materialCost, expense: exactExpense, pl: received - exactExpense };
  }
  let headerSeq = 0;
  let headerTimer = null;

  function plateRateFrom(rates, kind) {
    const v = rates[PLATE_RATE_KEYS[kind]];
    return (v !== undefined && v !== null && v !== "") ? (Number(v) || 0) : PLATE_DEFAULT[kind];
  }

  // एक तारीख का सारा डेटा: खर्च (5 सेक्शन), प्लेट रेट, और मोमोज़ की गिनती
  async function loadDayData(date, withCounts) {
    const result = await withTimeout(safeCall("getDayData", { date, withCounts: withCounts !== false }), 15000);
    if (result && !result.error) { try { localStorage.setItem("crave_day_" + date, JSON.stringify(result)); } catch (e) {} }
    return buildDayData(result, withCounts);
  }
  // pichhla dekha hua hisaab turant dikhao (upar ka laabh/haani); naya data aate hi badal jaata hai
  function applyCachedDay() {
    const date = currentDate();
    try { const raw = JSON.parse(localStorage.getItem("crave_day_" + date) || "null"); if (raw) applyDayData(date, buildDayData(raw, true)); } catch (e) {}
  }
  function buildDayData(result, withCounts) {
    const summaryRes = result && result.summary;
    const rates = (result && result.rates) || {};
    const entryRes = result && result.entry;
    const salesEntries = Array.isArray(result && result.salesEntries) ? result.salesEntries : null;
    const varieties = Array.isArray(result && result.varieties) ? result.varieties : [];
    const labelKeys = [["सामान की खरीद — Daily","daily"],["सामान की खरीद — Momos","momosSaaman"],["Packing की खरीद","packing"],["आज इस्तेमाल हुआ Material","materialCost"],["Work Expense","workExpense"],["Others","others"]];
    let expenseLines, missing, totalExpense;
    if (summaryRes && summaryRes.breakdown) {
      expenseLines = labelKeys.map(([label,key])=>({label,v:summaryRes.breakdown[key]}));
      missing=[]; totalExpense=Number(summaryRes.totalExpense)||0;
    } else {
      expenseLines=labelKeys.map(([label])=>({label,v:null})); missing=labelKeys.map(([label])=>label); totalExpense=0;
    }
    let counts=null; let loadFailed=!!withCounts;
    if (salesEntries !== null) loadFailed=false;
    if (entryRes && (entryRes.paneerCount !== undefined || entryRes.vegCount !== undefined)) {
      counts={paneer:Number(entryRes.paneerCount)||0,veg:Number(entryRes.vegCount)||0}; loadFailed=false;
    }
    return {rates,expenseLines,missing,totalExpense,counts,loadFailed,salesEntries:salesEntries||[],varieties,summary:summaryRes||null,stock:(result&&result.stock)||null};
  }

  function applyDayData(date, data) {
    if (dayCache && dayCache.date === date) {
      if (dayCache.counts) { data.counts=dayCache.counts; data.loadFailed=false; }
      if (Array.isArray(dayCache.salesEntries)) data.salesEntries=dayCache.salesEntries;
      if (Array.isArray(dayCache.varieties) && dayCache.varieties.length) data.varieties=dayCache.varieties;
      Object.keys(dayCache.rates||{}).forEach(k=>{ if(dayCache.rates[k]!==undefined) data.rates[k]=dayCache.rates[k]; });
    }
    dayCache=Object.assign({date},data);
    // getDayData already contains cash/online; use it instead of a separate getPayment call.
    const summary = data && data.summary;
    if (summary && (summary.cash !== undefined || summary.online !== undefined)) {
      const cash = Number(summary.cash) || 0, online = Number(summary.online) || 0;
      const ci = document.getElementById("cashInput"), oi = document.getElementById("onlineInput");
      if (ci && document.activeElement !== ci) ci.value = cash || "";
      if (oi && document.activeElement !== oi) oi.value = online || "";
      paymentLoadedFor = date;
      refreshReceived();
    }
    updateHeader();
  }

  async function refreshHeader() {
    const date = currentDate();
    const seq = ++headerSeq;
    const data = await loadDayData(date, true);
    if (seq !== headerSeq || date !== currentDate()) return;
    applyDayData(date, data);
  }
  function scheduleHeaderRefresh() {
    clearTimeout(headerTimer);
    headerTimer = setTimeout(refreshHeader, 700);
  }
  function onDateChange() {
    headerSeq++;
    dayCache = null;
    paymentLoadedFor = null;
    updateHeader();
    applyCachedDay();
    if (activeTab !== "momoshisab") setTimeout(() => refreshHeader(), 200);
  }

  function updateHeader() {
    const box = document.getElementById("headerPL");
    if (!box) return;
    const label = box.querySelector(".pl-label");
    const value = box.querySelector(".pl-value");
    const sub = box.querySelector(".pl-sub");
    const date = currentDate();
    box.classList.remove("loss");
    const r = computePL();
    if (!r) {
      label.textContent = "लाभ / हानि"; value.textContent = "…"; sub.textContent = "";
      return;
    }
    const dayWord = date === todayStr() ? "आज" : date.slice(8, 10) + "/" + date.slice(5, 7);
    if (r.pl === null) {
      label.textContent = dayWord + " का लाभ / हानि";
      value.textContent = "—";
      sub.textContent = dayCache && dayCache.loadFailed ? "गिनती लोड नहीं हो पाई" : "मोमोज़ की गिनती डालो";
      return;
    }
    const isLoss = r.pl < 0;
    label.textContent = dayWord + (isLoss ? " की हानि" : " का लाभ");
    value.textContent = money(Math.abs(r.pl));
    sub.textContent = dayCache.missing.length ? "⚠ खर्च अधूरा हो सकता है" : "";
    box.classList.toggle("loss", isLoss);
  }

  // ---------- tabs ----------
  let activeTab = "daily";
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
      renderSeq++;
      document.getElementById("tabContent").innerHTML = '<div class="card"><p class="muted">लोड हो रहा है…</p></div>';
      clearTimeout(tabTimer);
      tabTimer = setTimeout(renderActiveTab, 180);
    });
  });
  document.querySelector('.tab-btn[data-tab="daily"]').classList.add("active");

  function renderActiveTab() {
    renderSeq++;
    const c = document.getElementById("tabContent");
    c.innerHTML = '<div class="card"><p class="muted">लोड हो रहा है…</p></div>';
    const renderers = {
      daily: () => renderQtySection("daily", "Daily का सामान"),
      momos: () => renderQtySection("momos", "मोमोज़ बनाने का सामान"),
      packing: () => renderQtySection("packing", "Packing"),
      workexpense: renderWorkExpense, attendance: renderAttendance,
      momoshisab: renderMomosHisab, stock: renderStock, others: renderOthers
    };
    (renderers[activeTab] || renderers.daily)();

  // ===================================================================
  // कैश / ऑनलाइन — तारीख के साथ ऊपर ही, हर बार सीधे डाला/सेव किया जा सकता है
  // ===================================================================
  async function loadPayment() {
    const date = currentDate();
    try {
      const p = await call("getPayment", { date });
      document.getElementById("cashInput").value = p.cash || "";
      document.getElementById("onlineInput").value = p.online || "";
      paymentLoadedFor = date;
      refreshReceived();
    } catch (e) { /* चुप रहो, save karte waqt फिर कोशिश होगी */ }
  }

  let paymentSaveTimer = null;
  function schedulePaymentSave() {
    clearTimeout(paymentSaveTimer);
    const statusEl = document.getElementById("paymentStatus");
    paymentSaveTimer = setTimeout(async () => {
      const date = currentDate();
      const cash = parseFloat(document.getElementById("cashInput").value) || 0;
      const online = parseFloat(document.getElementById("onlineInput").value) || 0;
      statusEl.textContent = "सेव हो रहा है…";
      statusEl.classList.remove("err");
      try {
        await call("savePayment", { payload: { date, cash, online } });
        statusEl.textContent = "✓ सेव हो गया";
        scheduleHeaderRefresh();
      } catch (e) { statusEl.textContent = "⚠ " + e.message; statusEl.classList.add("err"); }
    }, 600);
  }
  document.getElementById("cashInput").addEventListener("input", schedulePaymentSave);
  document.getElementById("onlineInput").addEventListener("input", schedulePaymentSave);
  function onPaymentTyped() { paymentLoadedFor = currentDate(); refreshReceived(); }
  document.getElementById("cashInput").addEventListener("input", onPaymentTyped);
  document.getElementById("onlineInput").addEventListener("input", onPaymentTyped);
  // Payment is populated from getDayData; no separate startup request.

  // कैश + ऑनलाइन = कुल बिक्री। इससे हेडर और "रोज़ का हिसाब" टैब का लाभ/हानि बनता है
  function receivedNow() {
    return (parseFloat(document.getElementById("cashInput").value) || 0)
         + (parseFloat(document.getElementById("onlineInput").value) || 0);
  }
  function refreshReceived() {
    const cash = parseFloat(document.getElementById("cashInput").value) || 0;
    const online = parseFloat(document.getElementById("onlineInput").value) || 0;

    const el = document.getElementById("recvLine");
    if (el) {
      el.innerHTML = `
        <div class="strong"><span>कुल बिक्री का ब्योरा</span><span></span></div>
        <div><span>कैश</span><span>${money(cash)}</span></div>
        <div><span>ऑनलाइन</span><span>${money(online)}</span></div>
        <div class="strong"><span>कुल बिक्री</span><span>${money(cash + online)}</span></div>`;
    }

    const salesEl = document.getElementById("dhSales");
    if (salesEl) {
      const r = computePL();
      const hintEl = document.getElementById("dhCountHint");
      if (!r) {
        salesEl.textContent = "…";
        document.getElementById("dhExpense").textContent = "…";
        document.getElementById("dhPL").textContent = "…";
        const dhMomosCostEl = document.getElementById("dhMomosCost"); if (dhMomosCostEl) dhMomosCostEl.textContent = "…";
        document.getElementById("dhExpenseTotal").textContent = "…";
        if (hintEl) hintEl.textContent = "";
      } else {
        salesEl.textContent = money(r.received);
        const dhMomosCostEl2 = document.getElementById("dhMomosCost"); if (dhMomosCostEl2) dhMomosCostEl2.textContent = r.momos === null ? "—" : money(r.momos);
        document.getElementById("dhExpense").textContent = r.expense === null ? "—" : money(r.expense);
        document.getElementById("dhExpenseTotal").textContent = r.expense === null ? "—" : money(r.expense);
        if (r.pl === null) {
          document.getElementById("dhPLLabel").textContent = "लाभ / हानि";
          document.getElementById("dhPL").textContent = "—";
          document.getElementById("dhPLBox").classList.remove("clay");
          if (hintEl) hintEl.textContent = dayCache && dayCache.loadFailed
            ? "मोमोज़ की गिनती लोड नहीं हो पाई — नीचे \"फिर लोड करें\" दबाओ।"
            : "मोमोज़ की गिनती (पीस) नीचे डालो, तब लाभ / हानि दिखेगी।";
        } else {
          const isLoss = r.pl < 0;
          document.getElementById("dhPLLabel").textContent = isLoss ? "हानि" : "लाभ";
          document.getElementById("dhPL").textContent = money(Math.abs(r.pl));
          document.getElementById("dhPLBox").classList.toggle("clay", isLoss);
          if (hintEl) hintEl.textContent = "";
        }
      }
    }
    updateHeader();
  }

  // ===================================================================
  // qty सेक्शन (Daily का सामान / मोमोज़ बनाने का सामान / Packing)
  // ===================================================================
  async function renderQtySection(section, title) {
    const date = currentDate();
    const c = document.getElementById("tabContent");
    let masterRes, entriesRes;
    try {
      // Only the two requests required to draw this tab block first paint.
      [masterRes, entriesRes] = await Promise.all([
        call("getMaster", { section }), call("getEntries", { section, date })
      ]);
    } catch (e) {
      showLoadError(c, typeof e !== "undefined" ? e : null);
      return;
    }
    // Global rates are only a convenience for remembered per-item prices.
    // Fetch them in the background; localStorage is used immediately.
    let ratesRes = null;
    safeCall("getMomosHisabRates").then(r => {
      if (r && r.rates) {
        try { localStorage.setItem("crave_global_rates", JSON.stringify(r.rates)); } catch(e) {}
      }
    });
    const items = (masterRes.items || []).filter(it => it.active);
    const existing = {};
    (entriesRes.entries || []).forEach(e => { existing[String(e.itemId).trim()] = e; });

    // ₹/यूनिट हर दिन बना रहता है; मात्रा हर तारीख की अलग होती है (नई तारीख पर खाली)
    let savedRates = {};
    try { savedRates = JSON.parse(localStorage.getItem("crave_global_rates") || "{}") || {}; } catch(e) {}
    if (ratesRes && ratesRes.rates) Object.assign(savedRates, ratesRes.rates);
    const persistedRate = id => {
      const v = Number(savedRates[itemRateKey(section, id)]);
      if (v > 0) return v;
      try {
        const l = Number(localStorage.getItem("crave_" + itemRateKey(section, id)));
        if (l > 0) return l;
      } catch (e) {}
      return "";
    };
    const rememberRate = (id, value) => { savedRates[itemRateKey(section, id)] = value; persistItemRate(section, id, value); };

    let rows = items.map(it => {
      const ex = existing[String(it.id).trim()];
      const rateVal = (ex && Number(ex.rate) > 0) ? ex.rate : persistedRate(it.id);
      return `<tr data-id="${it.id}" data-unit="${esc(it.unit)}">
        <td class="name-cell">${esc(it.name)}<div class="muted" style="font-size:11px;">${esc(it.unit)}</div></td>
        <td class="num"><input type="number" class="qty-input" min="0" step="0.01" value="${ex?ex.quantity:''}" placeholder="0"></td>
        <td class="num"><input type="number" class="rate-input" min="0" step="0.01" value="${rateVal}" placeholder="0"></td>
        <td class="num row-total">₹0</td>
      </tr>`;
    }).join("");

    c.innerHTML = `
      <div class="card">
        <h2>${esc(title)}</h2>
        <p class="hint">${esc(date)} — मात्रा और कीमत डालो, कुल अपने आप बन जाएगा।</p>
        <div class="table-scroll">
          <table>
            <thead><tr><th>सामान</th><th class="num">मात्रा</th><th class="num">₹/यूनिट</th><th class="num">कुल ₹</th></tr></thead>
            <tbody id="qtyBody">${rows || '<tr><td colspan="4" class="muted">कोई सक्रिय आइटम नहीं है।</td></tr>'}</tbody>
            <tfoot><tr class="total-row"><td colspan="3">कुल</td><td class="num" id="qtyGrandTotal">₹0</td></tr></tfoot>
          </table>
        </div>
        <button class="primary" id="saveQtyBtn">सेव करें</button>
        <p class="save-status" id="qtyStatus"></p>

        <details class="master-manage">
          <summary>+ नया सामान जोड़ें / सूची बदलें</summary>
          <div class="add-form">
            <input type="text" id="newItemName" placeholder="नाम" class="wide" style="flex:2;">
            <input type="text" id="newItemUnit" placeholder="यूनिट (किलो/पीस)" style="flex:1;">
            <button class="secondary" id="addItemBtn">जोड़ें</button>
          </div>
          <div id="masterList" style="margin-top:12px;"></div>
        </details>
      </div>`;

    function recalcRow(tr) {
      const qty = parseFloat(tr.querySelector(".qty-input").value) || 0;
      const rate = parseFloat(tr.querySelector(".rate-input").value) || 0;
      tr.querySelector(".row-total").textContent = money(qty * rate);
    }
    function recalcAll() {
      let total = 0;
      document.querySelectorAll("#qtyBody tr[data-id]").forEach(tr => {
        recalcRow(tr);
        const qty = parseFloat(tr.querySelector(".qty-input").value) || 0;
        const rate = parseFloat(tr.querySelector(".rate-input").value) || 0;
        total += qty * rate;
      });
      document.getElementById("qtyGrandTotal").textContent = money(total);
    }
    document.querySelectorAll("#qtyBody input").forEach(inp => inp.addEventListener("input", recalcAll));
    document.querySelectorAll("#qtyBody .rate-input").forEach(inp => {
      const id = inp.closest("tr").getAttribute("data-id");
      let t = null;
      inp.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(() => rememberRate(id, parseFloat(inp.value) || 0), 600);
      });
    });
    recalcAll();

    document.getElementById("saveQtyBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("qtyStatus");
      statusEl.textContent = "सेव हो रहा है…";
      statusEl.classList.remove("err");
      const entries = [];
      document.querySelectorAll("#qtyBody tr[data-id]").forEach(tr => {
        entries.push({
          itemId: tr.getAttribute("data-id"),
          itemName: tr.querySelector(".name-cell").childNodes[0].textContent.trim(),
          quantity: parseFloat(tr.querySelector(".qty-input").value) || 0,
          unit: tr.getAttribute("data-unit"),
          rate: parseFloat(tr.querySelector(".rate-input").value) || 0
        });
      });
      try {
        const saved = await call("saveEntries", { section, payload: { date, entries } });
        await renderActiveTab();
        await refreshHeader();
        entries.forEach(e => {
          if (e.rate > 0 && Number(persistedRate(e.itemId)) !== e.rate) rememberRate(e.itemId, e.rate);
        });
        statusEl.textContent = "✓ सेव हो गया";
      } catch (e) { statusEl.textContent = "⚠ " + e.message; statusEl.classList.add("err"); }
    });

    renderMasterManage(section, masterRes.items || []);
    document.getElementById("addItemBtn").addEventListener("click", async () => {
      const name = document.getElementById("newItemName").value.trim();
      const unit = document.getElementById("newItemUnit").value.trim();
      if (!name || !unit) { alert("नाम और यूनिट दोनों भरें"); return; }
      await call("addMasterItem", { section, payload: { name, unit } });
      renderActiveTab();
    });
  }

  function renderMasterManage(section, items) {
    const el = document.getElementById("masterList");
    if (!el) return;
    el.innerHTML = items.map(it => `
      <div class="master-row">
        <span>${esc(it.name)} <span class="muted">(${esc(it.unit)})</span> ${it.active ? '' : '<span class="muted">— बंद</span>'}</span>
        <span>
          <button class="chip ${it.active?'on':''}" data-toggle="${it.id}">${it.active?'सक्रिय':'बंद'}</button>
          <button class="icon-btn danger" data-del="${it.id}">हटाएं</button>
        </span>
      </div>`).join("");
    el.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", async () => {
      await call("toggleMasterItem", { section, payload: { id: b.getAttribute("data-toggle") } });
      renderActiveTab();
    }));
    el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("ये आइटम पूरी तरह हटा दें?")) return;
      await call("deleteMasterItem", { section, payload: { id: b.getAttribute("data-del") } });
      renderActiveTab();
    }));
  }

  function formatQty(v, unit) {
    const n=Number(v)||0;
    if (unit === "किलो" || unit === "लीटर") return n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+' '+unit;
    return Math.round(n).toLocaleString("en-IN")+' '+unit;
  }

      let sales=0,totalPieces=0;
      getRows().forEach(e=>{const tr=c.querySelector(`tr[data-variety-id="${CSS.escape(e.varietyId)}"]`); tr.querySelector('.ms-plates').textContent=(e.pieces/e.piecesPerPlate).toFixed(2).replace(/\.00$/,''); tr.querySelector('.ms-total').textContent=money(e.total); sales+=e.total; totalPieces+=e.pieces;});

      let grand=0; const factor=totalPieces/MH_BASE_MOMOS; const paneerPieces=(getRows().find(e=>e.varietyId==='paneer')||{}).pieces||0;
      MH_ITEMS.forEach(it=>{const grams=it.key==='paneer'?MH_PANEER_PER_MOMO*paneerPieces:MH_GRAMS[it.key]*factor; const rate=rates[it.key]||0; const cost=grams/1000*rate; grand+=cost; const tr=tbody.querySelector(`tr[data-key="${CSS.escape(it.key)}"]`); if(tr){tr.querySelector('[data-qty]').textContent=grams>=1000?(grams/1000).toFixed(2)+' किग्रा':Math.round(grams)+' ग्राम'; tr.querySelector('[data-cost]').textContent=money(cost);}});

      const name=document.getElementById('newMomosName').value.trim(), price=parseFloat(document.getElementById('newMomosPrice').value)||0, pieces=parseInt(document.getElementById('newMomosPieces').value,10)||10;
      if(!name){alert('Variety का नाम डालें');return;}
      try{await call('addMomosVariety',{payload:{name,price,piecesPerPlate:pieces}}); const fresh=await call('getMomosVarieties'); dayCache.varieties=fresh.items||[]; renderMomosHisabBody();}catch(e){alert(e.message);}
    });

    const manage=document.getElementById('momosVarietyManage');
    manage.innerHTML=varieties.map(v=>`<div class="master-row"><span><b>${esc(v.name)}</b> — ₹${Number(v.price)||0}/plate, ${Number(v.piecesPerPlate)||10} पीस ${v.active?'':'<span class="muted">— बंद</span>'}</span><span><button class="chip ${v.active?'on':''}" data-mv-toggle="${esc(v.id)}">${v.active?'सक्रिय':'बंद'}</button><button class="icon-btn danger" data-mv-del="${esc(v.id)}">हटाएं</button></span></div>`).join('');
    manage.querySelectorAll('[data-mv-toggle]').forEach(b=>b.addEventListener('click',async()=>{await call('toggleMomosVariety',{payload:{id:b.getAttribute('data-mv-toggle')}}); const fresh=await call('getMomosVarieties'); dayCache.varieties=fresh.items||[]; renderMomosHisabBody();}));
    manage.querySelectorAll('[data-mv-del]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('इस variety को हटाएं? पुराने sales records सुरक्षित रहेंगे।'))return; await call('deleteMomosVariety',{payload:{id:b.getAttribute('data-mv-del')}}); const fresh=await call('getMomosVarieties'); dayCache.varieties=fresh.items||[]; renderMomosHisabBody();}));

    c.querySelectorAll('.ms-price').forEach(inp=>{let t=null; inp.addEventListener('change',()=>{const tr=inp.closest('tr'),id=tr.getAttribute('data-variety-id'),price=parseFloat(inp.value)||0; clearTimeout(t); t=setTimeout(async()=>{try{await call('updateMomosVariety',{payload:{id,price}}); const v=(dayCache.varieties||[]).find(x=>x.id===id); if(v)v.price=price;}catch(e){}},300);});});
    tbody.querySelectorAll('.mh-rate').forEach(inp=>{let t=null; inp.addEventListener('input',()=>{rates[inp.getAttribute('data-key')]=parseFloat(inp.value)||0; recalc(); clearTimeout(t); t=setTimeout(()=>call('saveMomosHisabRate',{payload:{key:inp.getAttribute('data-key'),value:rates[inp.getAttribute('data-key')]}}).catch(()=>{}),600);});});

    async function textReport(){
      const r=computePL();
      const money0=v=>money(Number(v)||0);
      const listLines=(items, formatter)=> items && items.length ? items.map(formatter) : ['• कोई entry नहीं'];
      try {
        const [dailyRes,momosRes,packingRes,workRes,othersRes]=await Promise.all([
          call('getEntries',{section:'daily',date}),
          call('getEntries',{section:'momos',date}),
          call('getEntries',{section:'packing',date}),
          call('getWorkExpense',{date}),
          call('getOthers',{date})
        ]);
        const daily=dailyRes.entries||[], momosSaaman=momosRes.entries||[], packing=packingRes.entries||[];
        const work=workRes.entries||[], others=othersRes.entries||[], sales=dayCache.salesEntries||[];
        const cash=Number(document.getElementById('cashInput')?.value)||0;
        const online=Number(document.getElementById('onlineInput')?.value)||0;
        const totalSales=cash+online;
        const materialCost=Number(dayCache.stock?.materialCost)||0;
        const workTotal=work.reduce((a,x)=>a+(Number(x.amount)||0),0);
        const othersTotal=others.reduce((a,x)=>a+(Number(x.amount)||0),0);
        const totalExpense=Number(r&&r.expense);
        const profit=totalSales-(Number.isFinite(totalExpense)?totalExpense:0);
        const lines=['📋 Crave Kitchen — रोज़ का हिसाब','📅 '+date,'',
          '💰 बिक्री',
          '• Cash: '+money0(cash),
          '• Online: '+money0(online),
          '• Total Sales: '+money0(totalSales),
          '',
          'Momos Sales',
          ...listLines(sales,e=>'• '+(e.varietyName||'Momos')+' — '+(Number(e.pieces)||0)+' पीस — '+money0(e.total)),
          '',
          'Daily का सामान — आज क्या आया',
          ...listLines(daily,e=>'• '+(e.itemName||'सामान')+' — '+(Number(e.quantity)||0)+' '+(e.unit||'')+' — '+money0(e.total)),
          '',
          'Momos बनाने का सामान — आज क्या आया',
          ...listLines(momosSaaman,e=>'• '+(e.itemName||'सामान')+' — '+(Number(e.quantity)||0)+' '+(e.unit||'')+' — '+money0(e.total)),
          '',
          'Packing — आज क्या आया',
          ...listLines(packing,e=>'• '+(e.itemName||'Packing')+' — '+(Number(e.quantity)||0)+' '+(e.unit||'')+' — '+money0(e.total)),
          '',
          'Work Expense',
          ...listLines(work,e=>'• '+(e.itemName||'Work')+' — '+money0(e.amount)),
          '',
          'Others',
          ...listLines(others,e=>'• '+(e.name||'Other')+' — '+money0(e.amount)),
          '',
          '💵 खर्च',
          '• आज इस्तेमाल हुआ Material: '+money0(materialCost),
          '• Work Expense: '+money0(workTotal),
          '• Others: '+money0(othersTotal),
          '• कुल खर्च: '+(Number.isFinite(totalExpense)?money0(totalExpense):'—'),
          '',
          '📈 '+(profit<0?'हानि':'लाभ')+': '+money0(Math.abs(profit))
        ];
        return lines.join('\n');
      } catch(e) {
        return '📋 Crave Kitchen — रोज़ का हिसाब\n📅 '+date+'\n\nरिपोर्ट तैयार नहीं हो सकी: '+(e&&e.message?e.message:'Unknown error');
      }
    }
    document.getElementById('shareWhatsappBtn').addEventListener('click',async()=>{const btn=document.getElementById('shareWhatsappBtn'); const old=btn.textContent; btn.textContent='रिपोर्ट तैयार हो रही है…'; try{const text=await textReport(); if(navigator.share){try{await navigator.share({text});return;}catch(e){}} window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');}finally{btn.textContent=old;}});
    recalc();
  }

  // Initial load: render the active tab once. रोज़ का हिसाब already loads the
  // complete day payload, so calling refreshHeader() here would duplicate the
  // slowest request on every page open.
  applyCachedDay();
  renderActiveTab();
  if (activeTab !== "momoshisab") setTimeout(() => refreshHeader(), 300);
</script>
</body>
</html>
